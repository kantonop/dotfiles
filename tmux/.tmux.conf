# Advertise modern color support to applications running inside tmux.
set -g default-terminal "tmux-256color"

# vi keys
set-window-option -g mode-keys vi

# split panes using | and -
bind | split-window -h
bind - split-window -v

# navigate panes
bind -r j select-pane -D
bind -r k select-pane -U
bind -r l select-pane -R
bind -r h select-pane -L

# resize panes
bind -r J resize-pane -D
bind -r K resize-pane -U
bind -r L resize-pane -R
bind -r H resize-pane -L

bind C command-prompt -p "New window name:" "new-window -n '%%'"
bind W command-prompt -T "window-target" -p "go to window:" "select-window -t '%%'"

# Enable mouse mode
set -g mouse on

# Use a 12-hour clock in clock mode and the status bar.
set -g clock-mode-style 12

# git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'catppuccin/tmux#v2.3.1'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Catppuccin: rounded window tabs and floating status modules.
# A Nerd Font is required for the icons and Powerline separators.
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_status_background "none"
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_number_position "left"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_flags "icon"

set -g @catppuccin_status_left_separator ""
set -g @catppuccin_status_middle_separator ""
set -g @catppuccin_status_right_separator " "
set -g @catppuccin_status_connect_separator "no"

# Keep useful context visible without turning the status line into a dashboard.
set -g @catppuccin_session_icon " "
set -g @catppuccin_directory_icon " "
set -g @catppuccin_application_icon " "
set -g @catppuccin_date_time_icon "󰃰 "
set -g @catppuccin_date_time_text " %a %d %b  %I:%M %p"

# Catppuccin must be loaded before its status modules are referenced.
run '~/.tmux/plugins/tmux/catppuccin.tmux'

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify absolute-centre
set -g status-left-length 80
set -g status-right-length 120
set -g status-left "#{E:@catppuccin_status_session}"
set -g status-right "#{E:@catppuccin_status_directory}"
set -ag status-right "#{E:@catppuccin_status_application}"
set -ag status-right "#{E:@catppuccin_status_date_time}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
